name: Capture actual synthetic-demo screenshots
on:
  pull_request:
    paths:
      - .github/workflows/capture-demo-screenshots.yml
jobs:
  capture:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Browser and server
        run: |
          npm exec --yes --package=playwright@1.56.1 -- playwright install --with-deps chromium
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/rentgram-vite.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/out.ndjson | grep -q 'SYNTHETIC EXAMPLE'
        working-directory: frontend
      - name: Save actual desktop and mobile screenshots
        run: |
          mkdir -p docs/screenshots
          npm exec --yes --package=playwright@1.56.1 -- playwright screenshot --browser chromium --viewport-size "1440,900" --wait-for-timeout 4000 http://127.0.0.1:4173/ docs/screenshots/hero.png
          npm exec --yes --package=playwright@1.56.1 -- playwright screenshot --browser chromium --viewport-size "390,844" --wait-for-timeout 4000 http://127.0.0.1:4173/ docs/screenshots/mobile.png
          test -s docs/screenshots/hero.png
          test -s docs/screenshots/mobile.png
      - name: Commit generated screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/hero.png docs/screenshots/mobile.png
          git diff --cached --quiet || { git commit -m "docs: capture current fictional desktop and mobile demo"; git push; }
